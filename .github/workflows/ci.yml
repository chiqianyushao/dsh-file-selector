name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The build and the smoke test use nothing but Node built-ins, so there is
      # no install step: `npm test` re-emits lib/ and then drives the built
      # client bundle against a fake DOM.
      - run: npm test
